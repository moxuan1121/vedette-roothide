name: Build RootHide package

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install build tools
        run: brew install make ldid dpkg xz
      - name: Install RootHide Theos
        run: |
          git clone https://github.com/roothide/theos.git "$RUNNER_TEMP/theos"
          git -C "$RUNNER_TEMP/theos" checkout 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos" submodule update --init --recursive
      - name: Install iOS 15.6 SDK
        run: |
          curl --fail --location --retry 3 \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS15.6.sdk.tar.xz \
            --output "$RUNNER_TEMP/sdk.tar.xz"
          echo "c4a02f5cac1101d1e5e506a1d117de38fd23714a6f535d50c64265bc7351f623  $RUNNER_TEMP/sdk.tar.xz" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          tar -xf "$RUNNER_TEMP/sdk.tar.xz" -C "$RUNNER_TEMP/theos/sdks"
      - name: Verify mode and dependency invariants
        run: |
          grep -q 'VDTViolationPolicyMonitorAndTerminate' VDTShared.h
          grep -q 'VDTViolationPolicyThrottle' VDTShared.h
          grep -q 'VDTViolationPolicyMonitorAndTemporaryThrottle' VDTShared.h
          grep -q 'proc_set_cpumon_params_fatal' VDTProcessManager.mm
          grep -q 'proc_set_cpumon_params(process.pid' VDTTemporaryThrottleManager.mm
          grep -q 'proc_clear_cpulimits' VDTTemporaryThrottleManager.mm
          grep -q 'VDT_TEMP_RECOVERY_SAMPLES 3' VDTTemporaryThrottleManager.mm
          grep -q 'VDT_TEMP_MAX_THROTTLE_NSEC (20ull' VDTTemporaryThrottleManager.mm
          grep -q 'VDT_TEMP_COOLDOWN_NSEC (5ull' VDTTemporaryThrottleManager.mm
          ! grep -R -E 'AltList|ATLApplication' --include='*.h' --include='*.m' --include='*.mm' --include='Makefile' .
      - name: Build optimized package
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          gmake clean
          gmake -j"$(sysctl -n hw.logicalcpu)" package FINALPACKAGE=1 DEBUG=0 \
            THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e TARGET=iphone:clang:15.6:15.0
      - name: Verify package
        run: |
          DEB="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Architecture)" = iphoneos-arm64e
          mkdir -p "$RUNNER_TEMP/root"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/root"
          TWEAK="$RUNNER_TEMP/root/Library/MobileSubstrate/DynamicLibraries/Vedette.dylib"
          PREFS="$RUNNER_TEMP/root/Library/PreferenceBundles/VedettePrefs.bundle/VedettePrefs"
          lipo -archs "$TWEAK" | grep -qw arm64e
          lipo -archs "$PREFS" | grep -qw arm64e
          ! otool -L "$PREFS" | grep -q AltList
          ! dpkg-deb -c "$DEB" | grep -q '/var/jb/'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vedette-temporary-throttle-roothide-arm64e
          path: packages/*.deb
          if-no-files-found: error
