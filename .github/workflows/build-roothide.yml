name: Build RootHide package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roothide-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS_REF: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
  THEOS_SDK_URL: https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS15.6.sdk.tar.xz
  THEOS_SDK_SHA256: c4a02f5cac1101d1e5e506a1d117de38fd23714a6f535d50c64265bc7351f623

jobs:
  package:
    name: arm64e / iOS 15 / RootHide
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: brew install make ldid dpkg xz

      - name: Install pinned RootHide Theos
        run: |
          git clone https://github.com/roothide/theos.git "$RUNNER_TEMP/theos"
          git -C "$RUNNER_TEMP/theos" checkout "$THEOS_REF"
          git -C "$RUNNER_TEMP/theos" submodule update --init --recursive

      - name: Install pinned iOS 15.6 patched SDK
        run: |
          curl --fail --location --retry 3 "$THEOS_SDK_URL" --output "$RUNNER_TEMP/iphoneos-sdk.tar.xz"
          echo "$THEOS_SDK_SHA256  $RUNNER_TEMP/iphoneos-sdk.tar.xz" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          tar -xf "$RUNNER_TEMP/iphoneos-sdk.tar.xz" -C "$RUNNER_TEMP/theos/sdks"
          test -f "$RUNNER_TEMP/theos/sdks/iPhoneOS15.6.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd"

      - name: Verify lightweight source invariants
        run: |
          ! grep -R -E 'proc_listpids|proc_listallpids|PROC_ALL_PIDS' --include='*.m' --include='*.mm' --include='*.xm' .
          ! grep -R -E 'monitor_pids|throttle_pids|proc_setcpu_percentage|proc_set_cpumon|VDTViolationPolicy' --include='*.h' --include='*.m' --include='*.mm' --include='*.xm' .
          ! grep -R -E 'AltList|ATLApplication' --include='*.h' --include='*.m' --include='*.mm' --include='Makefile' .
          grep -q 'VDT_IMMEDIATE_SAMPLE_INTERVAL_NSEC (250ull \* NSEC_PER_MSEC)' Common.h
          grep -q 'VDT_IMMEDIATE_STARTUP_GRACE_NSEC (1500ull \* NSEC_PER_MSEC)' Common.h
          grep -q 'VDT_IMMEDIATE_REQUIRED_VIOLATIONS 1' Common.h
          grep -q 'VDT_MAX_CPU_PERCENTAGE 800' Common.h
          grep -q '((double)elapsedCPU \* 100.0) / (double)elapsedAbsolute' VDTProcessManager.mm
          grep -q 'now - process.monitoringStartTime < startupGraceAbsoluteTicks' VDTProcessManager.mm
          grep -q 'kill(process.pid, SIGKILL)' VDTProcessManager.mm
          grep -q 'notify_new_pid(NOTIFY_PID_NN, (uint64_t)getpid());' Vedette.xm
          ! grep -q 'processEnabled' Vedette.xm
          ! grep -R '/var/jb' --include='*.m' --include='*.mm' --include='*.xm' --include='*.h' .

      - name: Build optimized RootHide package
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          gmake clean
          gmake -j"$(sysctl -n hw.logicalcpu)" package FINALPACKAGE=1 DEBUG=0 \
            THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e

      - name: Verify package architecture, layout, and bundles
        run: |
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64e"
          ! dpkg-deb -c "$DEB" | grep -q '/var/jb/'

          mkdir -p "$RUNNER_TEMP/package-root"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/package-root"
          TWEAK="$RUNNER_TEMP/package-root/Library/MobileSubstrate/DynamicLibraries/Vedette.dylib"
          PREFS="$RUNNER_TEMP/package-root/Library/PreferenceBundles/VedettePrefs.bundle/VedettePrefs"
          ENTRY="$RUNNER_TEMP/package-root/Library/PreferenceLoader/Preferences/VedettePrefs.plist"
          test -f "$TWEAK"
          test -f "$PREFS"
          test -f "$ENTRY"
          lipo -archs "$TWEAK" | grep -qw arm64e
          lipo -archs "$PREFS" | grep -qw arm64e
          ! otool -L "$PREFS" | grep -q 'AltList'
          plutil -lint "$ENTRY"
          /usr/libexec/PlistBuddy -c 'Print :entry:bundle' "$ENTRY" | grep -qx VedettePrefs

      - name: Upload installable deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vedette-roothide-arm64e
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
